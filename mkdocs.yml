site_name: База знаний
site_url: https://ttenushko.github.io/personal-wiki/
docs_dir: site-src

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: ru

extra_css:
  - extra.css

extra:
  generator: false

nav:
- Главная: index.md
- Личное:
  - Индекс: personal/index.md
- Разработка:
  - Индекс: dev/index.md
  - Источники: dev/sources/android-developers.md
- Автомобили:
  - Индекс: auto/index.md

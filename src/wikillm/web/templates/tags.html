{% extends "base.html" %}
{% block title %}Теги{% endblock %}
{% block content %}
<h2 style="margin-bottom: 15px;">Все теги</h2>
<div>
    {% for tag, count in tags.items() %}
    <a href="/search?q=#{{ tag }}" class="tag" style="font-size: 1rem; margin: 5px;">#{{ tag }} ({{ count }})</a>
    {% endfor %}
</div>
{% endblock %}
